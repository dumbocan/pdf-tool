name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  root-node:
    name: Root Node suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install root dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Randomized pseudonymization gate
        run: node --test test/*.test.js
      - name: Root dependency audit (prod only)
        run: pnpm audit --prod
      - name: Docker compose config validation
        run: docker compose config

  boundary-integration:
    name: "Boundary integration (pending requires WU-1E1)"
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Pending gate
        run: "echo pending requires WU-1E1 private stdio boundary"

  release-package:
    name: "Linux package smoke (pending requires Slice 5)"
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Pending gate
        run: "echo pending requires Slice 5 Linux qualification"
